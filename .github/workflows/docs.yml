# Build the Sphinx site in docs/ and publish it to GitHub Pages.
# One-time repository setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package (CPU JAX) and the docs tools
        # The API page imports pfcheeshmc. numpy and numba as in pixi.toml.
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "numpy>=2.0,<2.5" "numba==0.66.0" -r docs/requirements.txt
      - name: Build
        env:
          JAX_PLATFORMS: cpu
        run: sphinx-build -n -W --keep-going -b html docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
