[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pfcheeshmc"
version = "0.1.0"
description = "Pathfinder-ChEES-HMC posterior sampler compatible with PyMC model using BlackJAX backend"
requires-python = ">=3.11"
dependencies = [
    "blackjax>=1.7.0",
    "pymc>=5.0,<6.0",
    "jax[cuda13]>=0.9.0",
    "optax>=0.2.3",
    "arviz>=0.17.0",
    "tqdm>=4.66.0",
]

[tool.setuptools]
packages = ["pfcheeshmc"]             