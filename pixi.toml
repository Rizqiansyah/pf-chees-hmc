[workspace]
name = "pf-chees-hmc"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Shared GPU: JAX preallocates ~90% of VRAM by default, which
# starves other users. Off-switch so VRAM is requested as needed.
[activation.env]
XLA_PYTHON_CLIENT_PREALLOCATE = "false"
CUDA_VISIBLE_DEVICES = "0"
MPLBACKEND = "Agg"

[dependencies]
# 3.13 to match BlackJAX 1.7.x and the author's own notebook env
python = "3.13.*"
# BLAS/LAPACK for PyTensor's C backend (PyMC's initialisation and the tests that compare against it): without
# them the link fails (`cannot find -llapack`) on a machine without system BLAS.
libblas = ">=3.11.0,<4"
libcblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"

[pypi-dependencies]
# numpy 2.5 removed np.row_stack; numba<=0.66 (pytensor's cap) overloads it at
# import, so numba 0.67+ is required for numpy>=2.5 and pytensor forbids that.
# Keeping numpy<2.5 is the only satisfiable combination today.
numpy = ">=2.0,<2.5"
# Force stable numba: 0.63.0b1 (pre-release, falsely numpy>=1.22) breaks on
# numpy>=2.4 (np.trapz) and 0.67+ is outside pytensor's numba<=0.66 cap.
numba = "==0.66.0"
# the package itself, so `import pfcheeshmc` works from anywhere in the repo
pfcheeshmc = { path = ".", editable = true }
pymc = ">=5.0,<6.0"
# >= 1.7: the floor pyproject.toml declares (the ChEES adapter is blackjax.adaptation.chees_adaptation.base)
blackjax = ">=1.7.0"
# Driver 580.178.04 + sm_86: CUDA 13 wheels (JAX default). CUDA 12 also works
# but is on the deprecation path.
jax = { version = ">=0.9.0", extras = ["cuda13"] }
optax = ">=0.2.0"
arviz = ">=0.17.0"
pymc-extras = ">=0.0.1"
matplotlib = ">=3.8.0"
tqdm = ">=4.66.0"
ipykernel = ">=6.29.0"
nbconvert = ">=7.16.0"
pytest = ">=9.1.1, <10"
arviz-stats = { version = ">=1.3.3, <1.4", extras = ["xarray"] }

# The docs build: Sphinx with the pins of docs/requirements.txt, beside the package's own dependencies, so autodoc
# imports pfcheeshmc under the Python it needs (3.13). `pixi run -e docs docs`.
[feature.docs.pypi-dependencies]
sphinx = "==8.2.3"
myst-parser = "==4.0.1"
furo = "==2024.8.6"
sphinx-copybutton = "==0.5.2"

[feature.docs.tasks]
docs = "sphinx-build -b html -W --keep-going docs docs/_build/html"

[environments]
docs = ["docs"]

[tasks]
gpu-check = "python -c \"import jax; print(jax.__version__); print(jax.devices())\""
vram = "nvidia-smi --query-gpu=name,memory.total,memory.used --format=csv"
test = "python -m pytest tests -q"
